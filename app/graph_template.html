    document.getElementById("zoom-out").addEventListener("click", function () { zoomBy(1 / 1.35); });
    document.getElementById("zoom-up").addEventListener("click", collapseLast);
    panelToggle.addEventListener("click", function () {
      const open = panel.classList.toggle("open");
      panelToggle.setAttribute("aria-expanded", open ? "true" : "false");
    });
    filtersToggle.addEventListener("click", function () {
      const open = filters.classList.toggle("open");
      filtersToggle.setAttribute("aria-expanded", open ? "true" : "false");
    });

    /* ---------------- search ---------------- */

    const lowerLabel = nodeLabel.map(function (value) { return value.toLowerCase(); });
    const lowerPath = pathVocabulary.map(function (value) { return value.toLowerCase(); });
    let searchTimer = null;

    function hideResults() {
      resultsEl.hidden = true;
      resultsEl.textContent = "";
    }

    function runSearch() {
      const term = searchEl.value.trim().toLowerCase();
      if (term.length < 2) {
        hideResults();
        return;
      }
      const matches = [];
      for (let n = 0; n < nodeCount && matches.length < 400; n++) {
        const label = lowerLabel[n];
        let score = -1;
        if (label === term) score = 0;
        else if (label.indexOf(term) === 0) score = 1;
        else if (label.indexOf(term) > 0) score = 2;
        else if (lowerPath[nodePath[n]].indexOf(term) >= 0) score = 3;
        if (score >= 0) matches.push({ node: n, score: score });
      }
      matches.sort(function (a, b) {
        return a.score !== b.score ? a.score - b.score : degree[b.node] - degree[a.node];
      });
      resultsEl.textContent = "";
      resultsEl.hidden = false;
      if (!matches.length) {
        resultsEl.appendChild(element("div", "empty", "No symbol or file matches “" + searchEl.value + "”"));
        return;
      }
      matches.slice(0, 40).forEach(function (match) {
        const button = element("button");
        button.appendChild(document.createTextNode(nodeLabel[match.node]));
        button.appendChild(element("span", "sub", (pathVocabulary[nodePath[match.node]] || "(no source file)")
          + " · " + degree[match.node] + " links"));
        button.addEventListener("click", function () {
          hideResults();
          searchEl.blur();
          reveal(match.node, { openPanel: true });
        });
        resultsEl.appendChild(button);
      });
      if (matches.length > 40) {
        resultsEl.appendChild(element("div", "empty", "Showing 40 of " + matches.length + " matches"));
      }
    }

    searchEl.addEventListener("input", function () {
      if (searchTimer) clearTimeout(searchTimer);
      searchTimer = setTimeout(runSearch, 140);
    });
    searchEl.addEventListener("focus", function () {
      if (searchEl.value.trim().length >= 2) runSearch();
    });
    document.addEventListener("click", function (event) {
      if (!resultsEl.hidden && !resultsEl.contains(event.target) && event.target !== searchEl) hideResults();
    });
    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") {
        hideResults();
        if (state.focusNode >= 0) clearFocus(true);
      }
    });

    /* ---------------- taps ---------------- */

    function tapItem(item) {
      if (item.type === "cluster" && !state.expanded.has(item.index) && childrenOf(item.index).length) {
        selectItem(item);
        expandCluster(item.index);
        return;
      }
      selectItem(item);
      if (window.matchMedia("(max-width: 900px)").matches) openPanel();
    }

    function tapEmpty(worldX, worldY) {
      const container = containerAtWorld(worldX, worldY);
      if (container) {
        selectItem({ type: "container", index: container.cluster });
        if (window.matchMedia("(max-width: 900px)").matches) openPanel();
        return;
      }
      selectItem(null);
    }

    /* ---------------- start ---------------- */

    function autoExpand() {
      for (let guard = 0; guard < 6; guard++) {
        buildHierarchyView();
        if (items.length >= 8) break;
        const candidate = items
          .filter(function (item) { return item.type === "cluster" && !state.expanded.has(item.index); })
          .sort(function (a, b) { return b.weight - a.weight; })[0];
        if (!candidate) break;
        state.expanded.add(candidate.index);
        state.expansionOrder.push(candidate.index);
      }
    }

    readTheme();
    if (window.matchMedia) {
      const scheme = window.matchMedia("(prefers-color-scheme: dark)");
      const onSchemeChange = function () {
        readTheme();
        if (renderer) renderer.sync();
      };
      if (scheme.addEventListener) scheme.addEventListener("change", onSchemeChange);
      else if (scheme.addListener) scheme.addListener(onSchemeChange);
    }
    if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
    else window.addEventListener("resize", resize);
    window.addEventListener("orientationchange", resize);

    startRenderer();
    resize();
    autoExpand();
    renderLegend();
    rebuild({ fit: true });
  })();
  </script>
</body>
</html>
